<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Codex Remote Provider</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="../../build/icon.png" alt="">
      <span>Remote Provider</span>
    </div>
    <nav>
      <button class="nav" data-page="hosts"><i data-lucide="server"></i><span>远端主机</span></button>
      <button class="nav" data-page="repair"><i data-lucide="history"></i><span>修复旧对话</span></button>
      <button class="nav" data-page="proxy"><i data-lucide="globe"></i><span>本地代理</span></button>
      <button class="nav" data-page="logs"><i data-lucide="scroll-text"></i><span>日志</span></button>
      <button class="nav" data-page="settings"><i data-lucide="settings"></i><span>设置</span></button>
    </nav>
    <div class="side-status" id="sideStatus"></div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="pageTitle"></h1>
      <div class="actions" id="pageActions"></div>
    </header>
    <section class="content" id="content"></section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
